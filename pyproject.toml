[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "osc-app"
version = "0.1.0"
description = "Analizador de adquisiciones CSV y BIN de osciloscopios SIGLENT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PySide6>=6.7",
    "pyqtgraph>=0.13.7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
keywords = ["oscilloscope", "siglent", "waveform", "csv", "binary", "signal-analysis"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
osc-app = "osc_app.app.main:main"
osc-generate-sample = "osc_app.tools.generate_sample_csv:main"

[tool.setuptools.packages.find]
include = ["osc_app*"]

[tool.setuptools.package-data]
osc_app = ["resources/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
